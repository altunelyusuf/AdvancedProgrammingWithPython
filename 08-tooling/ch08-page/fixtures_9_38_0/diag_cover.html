<!doctype html><html><head><meta charset="utf-8"><title>fixture</title><style>body{margin:8px;font:16px sans-serif}.diagram{height:200px;border:1px solid #888;overflow:hidden}.diagram svg{width:100%;height:100%}.zbar{display:flex;gap:4px;margin:2px 0}.dprz{display:flex;justify-content:flex-end;min-height:24px}.dprh{min-width:40px;min-height:24px}.dpanel.dpfs{position:fixed;inset:0;background:#fff;z-index:99;display:flex;flex-direction:column}.dpanel.dpfs>.diagram{flex:1;height:auto!important}</style></head><body><div class="dpanel" id="p1"><div class="zbar" style="position:absolute;top:30px;left:30px;background:#fffc"><button type="button" data-z="in">+</button><button type="button" data-z="out">-</button><button type="button" data-z="fs" aria-pressed="false">Full screen</button></div><div class="diagram"><svg viewBox="0 0 300 150" role="img" aria-label="fixture figure 1"><rect x="10" y="10" width="280" height="130" fill="#cde"/><text x="20" y="80">figure 1</text></svg></div><div class="dprz"><button type="button" class="dprh" aria-label="resize">&#8690;</button></div></div><script>
document.querySelectorAll('.dpanel').forEach(w=>{const host=w.querySelector('.diagram'),h=w.querySelector('.dprh'),fs=w.querySelector('[data-z="fs"]');let st=null;
 const size=(wd,ht)=>{w.style.width=Math.min(innerWidth-16,Math.max(160,wd))+'px';host.style.height=Math.min(innerHeight*.92,Math.max(120,ht))+'px'};
 fs.onclick=()=>{const on=!w.classList.contains('dpfs');w.classList.toggle('dpfs',on);fs.setAttribute('aria-pressed',on)};
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){w.classList.remove('dpfs');fs.setAttribute('aria-pressed','false')}});
 h.addEventListener('pointerdown',e=>{st={x:e.clientX,y:e.clientY,w:w.getBoundingClientRect().width,h:host.getBoundingClientRect().height};try{h.setPointerCapture(e.pointerId)}catch(x){}});
 h.addEventListener('pointermove',e=>{if(st)size(st.w+e.clientX-st.x,st.h+e.clientY-st.y)});h.addEventListener('pointerup',()=>st=null);
 h.addEventListener('keydown',e=>{const r=host.getBoundingClientRect(),W=w.getBoundingClientRect().width;if(e.key==='ArrowDown')size(W,r.height+24);if(e.key==='ArrowUp')size(W,r.height-24);if(e.key==='ArrowRight')size(W+24,r.height);if(e.key==='ArrowLeft')size(W-24,r.height)})});
</script></body></html>
